server:
  port: 8101

spring:
  application:
    name: refine-identity-service
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:nacos:refine-identity-service.yml?group=REFINE
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: refine
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    template:
      retry:
        enabled: true
        initial-interval: 500ms
        max-attempts: 3
        multiplier: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

refine:
  datasource:
    primary-url: jdbc:mysql://localhost:3306/identity_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    replica-url: jdbc:mysql://localhost:3307/identity_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: identity_app
    password: ${IDENTITY_DB_PASSWORD}
  security:
    jwt-secret: ${JWT_SECRET}
    internal-token: ${INTERNAL_TOKEN}
    gateway-token: ${GATEWAY_TOKEN}
    access-token-ttl: PT30M
    refresh-token-ttl: P2D
  mail:
    enabled: true
    from: ${spring.mail.username}
    code-ttl: PT5M

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
