server:
  port: 8102

spring:
  application:
    name: refine-learning-service
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:nacos:refine-learning-service.yml?group=REFINE
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
  rabbitmq:
    host: localhost
    port: 5672
    username: refine
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    template:
      retry:
        enabled: true
        initial-interval: 500ms
        max-attempts: 3
        multiplier: 2
  flyway:
    enabled: true
    locations: classpath:db/migration

refine:
  datasource:
    primary-url: jdbc:mysql://localhost:3306/learning_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    replica-url: jdbc:mysql://localhost:3307/learning_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: learning_app
    password: ${LEARNING_DB_PASSWORD}
  security:
    internal-token: ${INTERNAL_TOKEN}
    gateway-token: ${GATEWAY_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
