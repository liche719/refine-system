server:
  port: 8080

spring:
  application:
    name: refine-gateway
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:nacos:refine-gateway.yml?group=REFINE
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 120s
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: '*'
            allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
            allowed-headers: '*'
            exposed-headers: [Content-Type]
      routes:
        - id: identity-login
          uri: lb://refine-identity-service
          predicates:
            - Path=/api/userAccount/login
        - id: identity-service
          uri: lb://refine-identity-service
          predicates:
            - Path=/api/userAccount/**
        - id: learning-service
          uri: lb://refine-learning-service
          predicates:
            - Path=/api/v1/keypoints_explanation/**,/api/v1/overview/**,/api/v1/mistake-reason/**,/api/v1/feedback/review/**
        - id: ai-ocr
          uri: lb://refine-ai-service
          predicates:
            - Path=/api/v1/ocr/**
        - id: ai-question
          uri: lb://refine-ai-service
          predicates:
            - Path=/api/question/**
        - id: ai-service
          uri: lb://refine-ai-service
          predicates:
            - Path=/api/v1/solve/**,/api/v1/conversation/**,/api/v1/learning-analysis/**,/api/v1/ai_suggession/**
    sentinel:
      transport:
        dashboard: localhost:8858
      eager: true
      datasource:
        gateway-rules:
          nacos:
            server-addr: localhost:8848
            data-id: refine-gateway-sentinel.json
            group-id: REFINE
            rule-type: gw-flow

refine:
  gateway:
    security:
      jwt-secret: ${JWT_SECRET}
      gateway-token: ${GATEWAY_TOKEN}
      public-paths:
        - /api/userAccount/sendEmailCode
        - /api/userAccount/register
        - /api/userAccount/login
        - /api/userAccount/resetPassword
        - /api/userAccount/refreshToken

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
