server:
  port: 8103

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: refine-ai-service
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:nacos:refine-ai-service.yml?group=REFINE
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000
            logger-level: basic
    sentinel:
      transport:
        dashboard: localhost:8858
      eager: true
      datasource:
        flow-rules:
          nacos:
            server-addr: localhost:8848
            data-id: refine-ai-sentinel.json
            group-id: REFINE
            rule-type: flow
  data:
    redis:
      host: localhost
      port: 6380
  rabbitmq:
    host: localhost
    port: 5672
    username: refine
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
        default-requeue-rejected: false
  flyway:
    enabled: true
    locations: classpath:db/migration

refine:
  datasource:
    primary-url: jdbc:mysql://localhost:3306/ai_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    replica-url: jdbc:mysql://localhost:3307/ai_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ai_app
    password: ${AI_DB_PASSWORD}
  security:
    internal-token: ${INTERNAL_TOKEN}
    gateway-token: ${GATEWAY_TOKEN}
  ocr:
    provider: openai-compatible
    base-url: https://llm-xtkyazx7u0me9k0m.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    model-name: qwen3.5-ocr
    api-key: ${OCR_API_KEY}
    timeout: PT60S
    max-retries: 2
    upload:
      max-size: 10MB
  pgvector:
    enabled: true
    retrieval-enabled: true
    url: jdbc:postgresql://localhost:5432/vector_db
    username: refine
    password: ${PGVECTOR_PASSWORD}
    document-path: ./docs/rag
    chunk-size: 450
    chunk-overlap: 80
    semantic-candidates: 12
    lexical-candidates: 12
    result-limit: 3
    minimum-fused-score: 0.016
    reciprocal-rank-constant: 60
  ai:
    memory:
      max-messages: 20
      idle-ttl: 24h

langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.codexzh.com/v1
      api-key: ${OPENAI_API_KEY}
      model-name: gpt-5.4-mini
      reasoning-effort: middle
      timeout: PT30S
      max-retries: 2
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: https://api.codexzh.com/v1
      api-key: ${OPENAI_API_KEY}
      model-name: gpt-5.4-mini
      reasoning-effort: middle
      timeout: PT120S
      log-requests: false
      log-responses: false
    embedding-model:
      base-url: https://llm-xtkyazx7u0me9k0m.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${OPENAI_EMBEDDING_API_KEY}
      model-name: qwen3.7-text-embedding
      dimensions: 1536
      timeout: PT30S
      max-retries: 2
      log-requests: false
      log-responses: false

feign:
  sentinel:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
